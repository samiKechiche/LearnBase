<mat-toolbar color="primary" class="app-toolbar">
  <a class="brand" routerLink="/exercises" aria-label="LearnBase home">
    <mat-icon>school</mat-icon>
    <span>LearnBase</span>
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    @for (link of navLinks; track link.path) {
      <a
        mat-button
        [routerLink]="link.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: link.path === '/exercises' }"
      >
        <mat-icon>{{ link.icon }}</mat-icon>
        {{ link.label }}
      </a>
    }
    @if (loggedIn) {
      <a
        mat-button
        (click)="logout()"
        aria-label="Sign out of LearnBase"
        class="sign-in-button"
      >
        <mat-icon>exit_to_app</mat-icon> Sign Out
      </a>
    }
    @else {
      <a
        mat-button
        routerLink="/login"
        routerLinkActive="active-link"
        aria-label="Sign in to LearnBase"
        class="sign-in-button"
      ><mat-icon>account_circle</mat-icon> Sign In</a>
    }

  </nav>
</mat-toolbar>

<main class="app-main">
  <router-outlet />
</main>
