<section class="page-shell">
  <div class="page-header">
    <div>
      <p class="eyebrow">Lesson Management</p>
      <h1>Lessons</h1>
    </div>

    <a mat-flat-button color="primary" routerLink="/lessons/new">
      <mat-icon>add</mat-icon>
      New lesson
    </a>
  </div>
  <div class="toolbar-row">
  <mat-form-field appearance="outline">
    <mat-label>Search lessons</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [formControl]="searchControl" placeholder="Title or description" />
  </mat-form-field>

  <button mat-stroked-button type="button" (click)="loadLessons()">
    <mat-icon>refresh</mat-icon>
    Refresh
  </button>
</div>
  
  @if (loading) {
    <div class="loading-state">
      <mat-spinner diameter="36"></mat-spinner>
    </div>
  } @else if (lessons.length === 0) {
    <div class="empty-state">
      <mat-icon>menu_book</mat-icon>
      <h2>No lessons yet</h2>

      <a mat-flat-button color="primary" routerLink="/lessons/new">
        Create lesson
      </a>
    </div>
  } @else {
    <div class="table-shell">
      <table mat-table [dataSource]="lessons">

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let lesson">
            <strong>{{ lesson.title }}</strong>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let lesson">
            <span class="answer-preview">
              {{ lesson.description }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="updatedAt">
          <th mat-header-cell *matHeaderCellDef>Updated</th>
          <td mat-cell *matCellDef="let lesson">
            {{ lesson.updatedAt | date:'mediumDate' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let lesson" class="actions-cell">

            <a
              mat-icon-button
              [routerLink]="['/lessons', lesson.lessonId, 'edit']"
              matTooltip="Edit"
            >
              <mat-icon>edit</mat-icon>
            </a>

            <button
              mat-icon-button
              color="warn"
              (click)="deleteLesson(lesson)"
              matTooltip="Delete"
            >
              <mat-icon>delete</mat-icon>
            </button>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>
    </div>
  }
</section>
